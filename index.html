<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#083e33">
<title>Misión 10 IA · Estación 8 · Mundo sostenible</title>
<style>
  :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;--bg:#062d31;--panel:#114e42;--edge:#40bfa6;--lime:#ffe566;--aqua:#7bf5d3;--cream:#f4fff8;--muted:#c4e9de}
  *{box-sizing:border-box}
  body{margin:0;color:var(--cream);background:radial-gradient(circle at 12% 0,#096d67 0,transparent 31%),radial-gradient(circle at 95% 28%,#217c46 0,transparent 30%),var(--bg);min-height:100vh}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:linear-gradient(#d8b0fa1c 1px,transparent 1px),linear-gradient(90deg,#d8b0fa1c 1px,transparent 1px);background-size:32px 32px}
  main{width:min(790px,100%);margin:0 auto;padding:22px 17px 42px;position:relative}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .pill{border:1px solid #e489ff;border-radius:999px;padding:9px 13px;font-weight:900;background:#085444;color:#e3fff7;font-size:.82rem;letter-spacing:.06em}
  .score{color:#ffe769}
  header{text-align:center;margin:25px 0 23px}
  .eyebrow{font-size:.78rem;letter-spacing:.2em;font-weight:800;color:var(--aqua)}
  header h1{font-size:clamp(2.0rem,8vw,3.6rem);line-height:1.05;margin:10px 0;color:var(--lime);text-shadow:0 3px 18px #ae3eb1}
  header p{color:#f2dafa;line-height:1.5;margin:8px auto;max-width:590px}
  .symbols{font-size:clamp(1.7rem,7vw,3.2rem);margin-top:12px}
  .progress{height:9px;border-radius:99px;overflow:hidden;background:#17625b;margin:19px 0 25px}
  .progress div{height:100%;background:linear-gradient(90deg,var(--aqua),var(--lime));transition:width .2s ease}
  .card{background:#0b3a38f2;border:1px solid var(--edge);border-radius:24px;padding:clamp(18px,5vw,31px);box-shadow:0 18px 40px #0a041490}
  h2{margin:4px 0 12px;font-size:clamp(1.4rem,4.5vw,1.9rem)}
  p{line-height:1.58}
  .kicker{font-size:.78rem;font-weight:800;color:var(--aqua);letter-spacing:.12em;text-transform:uppercase}
  .prompt{font-size:1.08rem;line-height:1.65;margin:10px 0 14px}
  .visual{padding:16px;background:#052c36;border:1px dashed #69cbae;border-radius:16px;margin:17px 0 20px;overflow-x:auto}
  .visual small{display:block;color:#acc6cb;line-height:1.4;margin-bottom:10px}
  .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .metric{background:#17354a;border-radius:13px;padding:12px 8px;text-align:center}
  .metric b{display:block;font-size:1.25rem;color:var(--lime)}.metric span{font-size:.76rem;color:#d0e1e9}
  .mini-bars{display:flex;align-items:end;justify-content:space-around;height:150px;gap:13px;padding:0 9px 8px;border-bottom:2px solid #89a5ad}
  .barcol{width:27%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:7px;font-size:.8rem}
  .barcol .bar{width:min(58px,100%);border-radius:7px 7px 0 0;background:linear-gradient(180deg,#a9ff66,#43ba9a);min-height:5px}
  .barcol b{color:#e6f8fc}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{padding:11px 14px;border:1px solid #4e94a9;background:#16394e;border-radius:11px;font-size:1.1rem;font-weight:800;color:var(--lime)}
  .marbles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:8px}
  .marble{height:35px;width:35px;border-radius:50%;box-shadow:inset -8px -7px 12px #0005, inset 6px 5px 8px #fff7}
  .blue{background:#3fafff}.green{background:#68dd66}.orange{background:#ffad40}
  .chart{display:flex;align-items:end;justify-content:space-around;gap:14px;height:164px;padding:12px 8px 24px;border-bottom:2px solid #a3b9be;position:relative}
  .chart:before{content:"48";position:absolute;bottom:-6px;left:0;font-size:.7rem;color:#b5c7cb;transform:translateY(100%)}
  .chartbar{width:40%;max-width:135px;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:4px;position:relative}
  .chartbar .column{width:100%;background:linear-gradient(#67f4b0,#35a6bd);border-radius:8px 8px 0 0}
  .chartbar b{font-size:.84rem;color:#e0f7ff}
  .data-table{width:100%;border-collapse:collapse;text-align:center;font-size:.9rem}
  .data-table th,.data-table td{border-bottom:1px solid #376279;padding:11px 7px}
  .data-table th{color:var(--aqua)}
  .options{display:grid;gap:11px}
  .option{display:block;width:100%;text-align:left;border:1px solid #52b2a3;border-radius:14px;background:#11554e;color:#f1fbff;padding:15px;cursor:pointer;font-size:1rem;line-height:1.5}
  .option:hover:not(:disabled){border-color:var(--lime)}.option.active{background:#21786a;border:2px solid var(--lime);padding:14px}
  .option:disabled{cursor:default;opacity:.85}
  .option b{color:var(--lime);margin-right:7px}
  label{display:block;font-weight:800;margin:10px 0 9px}
  input{width:100%;border:1px solid #64d3bd;background:#052a30;color:white;border-radius:13px;padding:15px;font-size:1.1rem}
  input:focus-visible,.option:focus-visible,button:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
  .hint{color:var(--muted);font-size:.87rem;margin:9px 0}
  .btn{width:100%;border:0;border-radius:13px;background:var(--lime);color:#06263a;font-weight:900;font-size:1.02rem;padding:16px;margin-top:17px;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:transparent;border:1px solid #a6ebd6;color:#fff3ff}
  .feedback{padding:15px;margin-top:17px;border-radius:13px;background:#234d43;line-height:1.55;border:1px solid #6eac96}
  .feedback.no{background:#6a2b2c;border-color:#be6483}
  .result{font-size:clamp(2.5rem,10vw,4rem);font-weight:1000;text-align:center;color:var(--lime);margin:12px 0}
  .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .notice{background:#11584d;border:1px solid #72d7c3;border-radius:12px;padding:14px;line-height:1.5}
  footer{text-align:center;color:#a7c3cd;font-size:.8rem;margin-top:22px;line-height:1.6}

  .fake-message{background:#30164b;border:2px solid #e49af8;padding:17px;border-radius:15px;text-align:center}
  .fake-message p{font-size:1.1rem;font-weight:800;color:#fff2f6;line-height:1.5}
  .fake-message.danger{border-color:#ff7777;background:#441b43}
  .fake-mark{color:#ffdf63;background:#532865;display:inline-block;border-radius:7px;padding:5px 9px;font-weight:900;font-size:.8rem;letter-spacing:.08em}
  .fake-url{font-family:monospace;background:#170d26;border:1px solid #b66c94;padding:9px 12px;border-radius:7px;color:#ffc1c1;overflow-wrap:anywhere;display:block}
  .evidence-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;text-align:center}
  .evidence{padding:16px;background:#3c2056;border:1px solid #9961bf;border-radius:13px;min-height:120px}
  .evidence>b{color:#ffdf63;font-size:1rem}.evidence p{font-weight:700;margin:13px 0 0}
  .sources{display:grid;gap:9px}.sources>div{background:#321b4c;border:1px solid #9961bf;border-radius:10px;padding:13px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}.sources span{font-size:1.6rem}.sources strong{color:#ffdf63}.sources small{color:#e7d6f5}

  .code-screen{border-radius:14px;background:#10112c;border:1px solid #756bdd;padding:17px 15px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#fff9de;box-shadow:inset 0 0 25px #24195f}
  .code-screen small{color:#85f5ff!important;letter-spacing:.05em;font-weight:700}
  .code-screen pre{white-space:pre-wrap;font-size:clamp(.84rem,3vw,1.05rem);line-height:1.8;color:#e7fcff;margin:0}
  .code-line{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px dashed #5a5e96;font-size:1.1rem}
  .code-line span{color:#77dafa}.code-line strong{color:#ffe769;font-size:1.3rem}
  .code-output{background:#35409a;color:#ffef79;padding:12px;text-align:center;font-weight:900;border-radius:9px;margin-top:12px}
  .lights{display:flex;gap:15px;justify-content:center;margin:10px 0 20px}.lights span{border:2px solid #c6ccf6;width:42px;height:42px;border-radius:50%;opacity:.65}.lights .red{background:#e45265}.lights .yellow{background:#ffdc50}.lights .green{background:#4de6a3}
  .grid-machine{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,42px);gap:4px;margin:12px auto;max-width:320px;background:linear-gradient(90deg,#323672 1px,transparent 1px),linear-gradient(#323672 1px,transparent 1px);background-size:25% 33.333%;border:1px solid #767de3;border-radius:7px;padding:3px}
  .grid-machine>div{display:grid;place-items:center;background:#39355f;border:1px solid #8c79b1;border-radius:5px;font-size:1.3rem}.grid-machine .target{background:#0e635b}.grid-machine .robotcell{background:#215284}.grid-machine .route{color:#ffd959;font-weight:900}
  .coords{text-align:center;color:#c3ddff;font-size:.78rem}
  .machine-row{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;margin:8px auto;max-width:330px;align-items:center;text-align:center}
  .machine-row b{padding:10px;background:#364078;border-radius:8px;font-size:1.45rem;color:#ffe679}.machine-row span{padding:12px 4px;border:1px solid #5bbfcf;border-radius:11px;color:#89edff;font-size:.83rem}.machine-row.new b{background:#7b2e88}

  /* Recursos visuales de la estación ambiental */
  .eco-panel{padding:16px;border-radius:14px;background:linear-gradient(160deg,#0b534c,#093040);border:1px solid #6fdcb5;color:white}
  .eco-hero{font-size:3.25rem;text-align:center;margin:4px 0 17px}
  .eco-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .eco-stats>div{background:#156b5a;border-radius:12px;text-align:center;padding:11px 4px}
  .eco-stats b,.eco-stats small{display:block}.eco-stats b{color:#ffe56c;font-size:clamp(.95rem,3.5vw,1.25rem)}.eco-stats small{font-size:.75rem;color:#e6fff7}
  .eco-note{font-size:.87rem;color:#e9ffe4;text-align:center;margin:16px 0 0;line-height:1.45}
  .bulb-compare,.coast-grid{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:9px;text-align:center}
  .bulb-compare>div:not(.eco-arrow),.coast-grid>div{padding:13px 5px;border-radius:13px;background:#135b4f;display:grid;gap:6px;justify-items:center}
  .bulb-compare span,.coast-grid span{font-size:2.55rem}.bulb-compare strong,.coast-grid strong{font-size:.78rem;color:#b8ffe3}
  .bulb-compare b,.coast-grid b{font-size:1.45rem;color:#ffe56c}.eco-arrow{font-size:2rem;color:#ffe56c}
  .waste-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .waste-grid>div{background:#155f55;border:1px solid #83d3be;padding:12px 6px;border-radius:11px;text-align:center;display:grid;gap:5px;justify-items:center;font-size:2.2rem}
  .waste-grid b{font-size:.95rem;color:#f9ffec}.waste-grid small{font-size:.76rem;color:#bdf7e7}
  .coast-grid{grid-template-columns:1fr 1fr}.coast-grid>div{min-height:143px}.coast-grid .no-mangrove{background:#68533f}
  .budget-top{text-align:center;background:#237060;border-radius:11px;padding:13px;font-size:.88rem}.budget-top b{color:#ffed63;font-size:1.15rem}
  .budget-table{width:100%;border-collapse:collapse;margin-top:13px;text-align:center}.budget-table th,.budget-table td{border-bottom:1px solid #64a998;padding:12px 5px;font-size:.9rem}.budget-table th{color:#acffea}
  @media (max-width:400px){.bulb-compare span,.coast-grid span{font-size:2rem}}
  @media(max-width:450px){.metric b{font-size:1.05rem}.metric span{font-size:.72rem}.marble{height:29px;width:29px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main>
  <div class="head"><span class="pill">🌎 MISIÓN 08</span><span id="scoreTop" class="pill score">🏆 0 PTS</span></div>
  <header><div class="eyebrow">Gincana de retos y conocimiento</div><div class="symbols">🌎 🌱 ♻️</div><h1>MUNDO SOSTENIBLE</h1><p>¡Ecoalerta! La ciudad necesita un plan verde. Superen cinco retos ambientales con cálculos, evidencias y decisiones responsables.</p></header>
  <div class="progress" aria-label="Progreso de la misión"><div id="progressFill" style="width:0%"></div></div>
  <section class="card" id="app" aria-live="polite"></section>
  <footer>MISIÓN 10 IA · Estación 8 · Cinco retos de 20 puntos · Puntuación máxima: 100</footer>
</main>
<script>
'use strict';
// Misma URL institucional de Apps Script utilizada en las estaciones anteriores.
const ENDPOINT = 'https://script.google.com/a/macros/iedigital.edu.co/s/AKfycbyrz9NVJT-lpTcXlXuVYs06Mu8JpsyChqn8I6Hn9VjhsQ9nnM9zUJrZ4cArkg-guu8/exec';
const STATION = '08';
const QUESTIONS = [
 {
   title:'La fuga silenciosa',tag:'Reto 1 · Agua y proporciones',visual:'water',type:'choice',
   prompt:'En un colegio, una llave mal cerrada deja escapar 0,5 litros por minuto durante 12 minutos al día. Si esto ocurre 7 días seguidos, ¿cuántos litros se desperdician en total?',
   options:['14 litros','21 litros','42 litros','84 litros'],answer:2,
   why:'Primero: 0,5 × 12 = 6 litros diarios. En 7 días: 6 × 7 = 42 litros desperdiciados.'
 },
 {
   title:'Cambia la iluminación',tag:'Reto 2 · Ahorro de energía',visual:'energy',type:'choice',
   prompt:'Se reemplazan 6 bombillos de 50 W por 6 bombillos LED de 8 W. Cada uno funciona 4 horas al día durante 5 días. ¿Cuánta energía se ahorra en total?',
   options:['1,008 kWh','5,04 kWh','50,4 kWh','0,504 kWh'],answer:1,
   why:'Cada bombillo ahorra 50 − 8 = 42 W. Los 6 ahorran 252 W. Durante 4 × 5 = 20 horas: 252 × 20 = 5040 Wh = 5,04 kWh.'
 },
 {
   title:'Detectives del residuo',tag:'Reto 3 · Clasificación responsable',visual:'waste',type:'choice',
   prompt:'En una jornada quedan 2 botellas plásticas limpias, 1 pila usada, 1 cáscara de banano y 1 cartón empapado de grasa. ¿Qué decisión es la más adecuada?',
   options:['Meter los cinco elementos en la misma bolsa de reciclaje.','Reciclar las botellas; llevar la pila a recolección especial; compostar la cáscara si existe compostaje, y separar el cartón contaminado.','Enterrar la pila y la cáscara para que se descompongan.','Lavar la pila y ponerla junto con las botellas reciclables.'],answer:1,
   why:'Los residuos tienen tratamientos distintos: la pila requiere manejo especial; las botellas limpias pueden reciclarse; la cáscara puede compostarse donde exista el sistema, y el cartón muy grasoso no se mezcla con reciclables limpios.'
 },
 {
   title:'El escudo del manglar',tag:'Reto 4 · Interpretación científica',visual:'habitat',type:'choice',
   prompt:'Después de una misma tormenta, un sector costero con manglar conservado perdió 2 metros de playa y otro sin manglar perdió 8 metros. ¿Cuál conclusión es más responsable?',
   options:['Los manglares garantizan que jamás exista erosión.','La diferencia demuestra por sí sola que el manglar fue la única causa.','El manglar podría ayudar a reducir la erosión, pero hay que estudiar también las otras condiciones de ambos sectores.','La cantidad de manglar no merece investigarse.'],answer:2,
   why:'Los datos sugieren que conservar manglares podría ser protector; sin embargo, una comparación no prueba por sí sola una causa única. También pueden variar las olas, el suelo y la forma de la costa.'
 },
 {
   title:'El presupuesto ecológico',tag:'Reto 5 · Optimización',visual:'budget',type:'choice',
   prompt:'Hay 8 créditos para proyectos de ahorro de agua. El proyecto A cuesta 3 y ahorra 20 L/día; B cuesta 4 y ahorra 35 L/día; C cuesta 5 y ahorra 45 L/día. ¿Cuál opción ahorra más agua SIN superar los 8 créditos?',
   options:['A + B: ahorran 55 L/día.','A + C: ahorran 65 L/día.','B + C: ahorran 80 L/día.','Solo C: ahorra 45 L/día.'],answer:1,
   why:'A + C cuesta 3 + 5 = 8 créditos y ahorra 20 + 45 = 65 L/día. B + C ahorraría más, pero cuesta 9 y supera el presupuesto.'
 }
];
const app = document.getElementById('app');
const scoreTop = document.getElementById('scoreTop');
const progressFill = document.getElementById('progressFill');
let team = '', step = -1, selection = null, confirmed = false, responses = [], attemptId = '', sent = false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function points(){return responses.reduce((total,v,i)=>total+(v===QUESTIONS[i].answer?20:0),0);}
function genId(){return 'M10-08-'+Date.now()+'-'+Math.random().toString(36).slice(2,12);}
function visualization(type){
  switch(type){
    case 'water':return '<div class="eco-panel"><div class="eco-hero">🚰 💧</div><div class="eco-stats"><div><b>0,5 L</b><small>por minuto</small></div><div><b>12 min</b><small>cada día</small></div><div><b>7 días</b><small>de fuga</small></div></div><p class="eco-note">¿Cuántos litros se pierden en toda la semana?</p></div>';
    case 'energy':return '<div class="eco-panel"><div class="bulb-compare"><div><span>💡</span><strong>ANTES</strong><b>6 × 50 W</b></div><div class="eco-arrow">→</div><div><span>🌟</span><strong>AHORA LED</strong><b>6 × 8 W</b></div></div><p class="eco-note">⏱️ 4 horas al día · 5 días · 1000 Wh = 1 kWh</p></div>';
    case 'waste':return '<div class="eco-panel"><div class="waste-grid"><div>🥤<b>2 botellas</b><small>plástico limpio</small></div><div>🔋<b>1 pila</b><small>usada</small></div><div>🍌<b>1 cáscara</b><small>de banano</small></div><div>📦<b>1 cartón</b><small>con mucha grasa</small></div></div><p class="eco-note">No todos los residuos van al mismo recipiente.</p></div>';
    case 'habitat':return '<div class="eco-panel"><div class="coast-grid"><div class="mangrove"><span>🌳 🌳</span><strong>CON MANGLAR</strong><b>2 m</b><small>de playa perdida</small></div><div class="no-mangrove"><span>🌊 🏖️</span><strong>SIN MANGLAR</strong><b>8 m</b><small>de playa perdida</small></div></div><p class="eco-note">Observación después de la misma tormenta ≠ prueba de una causa única.</p></div>';
    case 'budget':return '<div class="eco-panel"><div class="budget-top">💰 PRESUPUESTO MÁXIMO: <b>8 créditos</b></div><table class="budget-table"><thead><tr><th>Proyecto</th><th>Costo</th><th>Ahorro de agua</th></tr></thead><tbody><tr><td>🟩 A</td><td>3</td><td>20 L/día</td></tr><tr><td>🟦 B</td><td>4</td><td>35 L/día</td></tr><tr><td>🟨 C</td><td>5</td><td>45 L/día</td></tr></tbody></table><p class="eco-note">Elige la combinación que maximiza el ahorro sin exceder el presupuesto.</p></div>';
    default:return '';
  }
}
function formPost(){
  const iframe = document.createElement('iframe');
  iframe.name='m10_frame_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  iframe.hidden=true;
  iframe.setAttribute('title','Envío de resultado de Misión 10 IA');
  document.body.appendChild(iframe);
  const form=document.createElement('form');form.method='POST';form.action=ENDPOINT;form.target=iframe.name;form.style.display='none';
  const payload={equipo:team,estacion:STATION,puntos:String(points()),id:attemptId};
  for(const [key,value] of Object.entries(payload)){
    const item=document.createElement('input');item.type='hidden';item.name=key;item.value=value;form.appendChild(item);
  }
  document.body.appendChild(form);form.submit();
  // El contenido de respuesta es de otro origen; no interpretamos el envío como confirmación.
  setTimeout(()=>{form.remove();iframe.remove();},20000);
}
function trySend(){if(sent)return;sent=true;formPost();}
function reset(){team='';step=-1;selection=null;confirmed=false;responses=[];attemptId='';sent=false;render();}
function render(){
  scoreTop.textContent='🏆 '+points()+' PTS';
  progressFill.style.width=(step<0?'0':step>=5?'100':String(step*20))+'%';
  if(step===-1){
    app.innerHTML='<div class="kicker">Acceso de agentes</div><h2>🌱 Activar misión ambiental</h2><p>Son cinco retos de agua, energía, residuos, biodiversidad y uso responsable de recursos. Cada acierto vale 20 puntos. Discutan la evidencia antes de confirmar: una respuesta confirmada no se puede cambiar.</p><label for="team">Código del equipo</label><input id="team" maxlength="7" placeholder="M10-001" autocomplete="off" autocapitalize="characters"><p class="hint">Códigos autorizados: M10-001 a M10-020</p><button id="start" class="btn">COMENZAR MISIÓN 08</button>';
    document.getElementById('start').onclick=()=>{
      const input=document.getElementById('team').value.trim().toUpperCase();
      if(!/^M10-0(0[1-9]|1[0-9]|20)$/.test(input)){alert('Escribe un código válido entre M10-001 y M10-020');return;}
      team=input;step=0;attemptId=genId();sent=false;render();
    };
    return;
  }
  if(step===QUESTIONS.length){
    app.innerHTML='<div class="kicker">Plan verde completado</div><h2>🏆 ¡MISIÓN COMPLETADA!</h2><div class="result">'+points()+' / 100</div><p style="text-align:center">Equipo <strong>'+esc(team)+'</strong> · '+(points()/20)+' respuestas correctas de 5</p><div class="notice"><strong>📡 Envío solicitado a Google Sheets.</strong><br>Esta pantalla no puede confirmar por sí misma que el registro quedó guardado. Pide al docente revisar la pestaña <b>Intentos</b>, estación <b>08</b>.</div><button id="retry" class="btn secondary">REINTENTAR ENVÍO DE ESTE MISMO INTENTO</button><button id="again" class="btn">VOLVER A JUGAR</button><p class="hint">El reenvío conserva el mismo ID para evitar duplicados.</p>';
    trySend();
    document.getElementById('retry').onclick=()=>{formPost();alert('Se intentó reenviar el mismo resultado. Verifica en Google Sheets.');};
    document.getElementById('again').onclick=reset;
    return;
  }
  const q=QUESTIONS[step];
  const options=q.type==='choice'?'<div class="options">'+q.options.map((option,i)=>'<button type="button" data-option="'+i+'" class="option'+(selection===i?' active':'')+'" '+(confirmed?'disabled':'')+'><b>'+String.fromCharCode(65+i)+'.</b> '+esc(option)+'</button>').join('')+'</div>':'<label for="numeric">Escribe tu respuesta numérica</label><input id="numeric" type="number" min="0" max="1000" step="any" inputmode="decimal" placeholder="Ingresa un número" '+(confirmed?'disabled':'')+' value="'+(selection===null?'':String(selection))+'"><p class="hint">Puedes usar punto o coma para los decimales. No incluyas símbolos.</p>';
  const feedback=confirmed?'<div class="feedback'+(selection===q.answer?'':' no')+'"><strong>'+(selection===q.answer?'✅ ¡Decisión acertada!':'🧩 Revisen los datos de la misión')+'</strong><p>'+esc(q.why)+'</p></div>':'';
  app.innerHTML='<div class="row"><div class="kicker">'+esc(q.tag)+'</div><div class="hint">RETO '+(step+1)+' / 5</div></div><h2>'+esc(q.title)+'</h2><p class="prompt">'+esc(q.prompt)+'</p><div class="visual">'+visualization(q.visual)+'</div>'+options+'<button class="btn" id="continue" '+(selection===null?'disabled':'')+'>'+(confirmed?(step===4?'FINALIZAR MISIÓN':'SIGUIENTE DESAFÍO'):'CONFIRMAR RESPUESTA')+'</button>'+feedback;
  if(!confirmed && q.type==='choice'){
    app.querySelectorAll('[data-option]').forEach(el=>el.onclick=()=>{selection=Number(el.dataset.option);render();});
  }
  if(!confirmed && q.type==='number'){
    const input=document.getElementById('numeric');
    input.addEventListener('input',()=>{const txt=input.value.trim().replace(',','.');selection=(txt!==''&&Number.isFinite(Number(txt)))?Number(txt):null;document.getElementById('continue').disabled=selection===null;});
  }
  document.getElementById('continue').onclick=()=>{
    if(selection===null)return;
    if(!confirmed){responses.push(selection);confirmed=true;render();}
    else{step++;confirmed=false;selection=null;render();}
    app.scrollIntoView({block:'start',behavior:'auto'});
  };
}
render();
</script>
</body></html>
